  # ---- LinkedIn Outreach: delivery-transport routing (OPTIONAL) ----
  - object: linkedin_outreach
    slug: send_channel
    type: select
    options: ["pb", "botdog"]
    pr_id: PR-279
    status: planned
    write_owner_module:
      - scripts.attio_dedup
    note: |
      Delivery-transport stamp for the OPTIONAL Botdog transport.
      PhantomBuster owns sending: `run_dm_sequencing` /
      `run_connection_requests` only READ this field (missing/None ->
      daily_check_helpers.SEND_CHANNEL_DEFAULT = "pb"), and no send path
      routes to Botdog. A row stamped `botdog` is HELD OUT of PB invites
      and DMs and of the Phase 0 / 0.5 scrape detectors, so it gets no
      outreach from any transport until an operator re-stamps it `pb` —
      the double-send guard for a prospect a Botdog campaign may still
      hold. Deliberately absent from
      schema_preflight.DM_ENTRY_WRITER_ATTRS (the send path never writes
      it). The only registered writer is scripts.attio_dedup, which must
      carry the stamp onto the surviving entry when it merges records.
      Provision it only with `scripts/setup_attio_schema.py --feature
      botdog`; a fresh install never needs the attribute at all.

  # ---- LinkedIn Outreach: pain-signal discovery lane (OPTIONAL) ----
  # Stamped ONCE at PROSPECT-commit by workflows/pain_signal.py, through
  # `_commit_prospect(lane_entry_attrs=...)`. The daily invite builder only
  # READS prospect_source / pain_source_type to pick the note frame; no send
  # path writes any of them. The lane is off by default
  # (OUTBOUND_PAIN_SIGNAL_ENABLED) so a fresh install carries none of these,
  # and parse_entry reads them as None. Provision with
  # `scripts/setup_attio_schema.py --feature pain_signal`.
  - object: linkedin_outreach
    slug: prospect_source
    type: select
    options: ["pain_signal"]
    pr_id: PR-280
    status: planned
    write_owner_module:
      - workflows.pain_signal.run_pain_signal_discovery
    note: |
      Which discovery lane sourced this prospect. NULL on every
      weekly-search prospect. Read by daily_check._build_invite_send_data
      to route the connection note to the pain-signal group instead of the
      persona group.

  - object: linkedin_outreach
    slug: pain_source_type
    type: select
    options: ["poster", "commenter", "liker"]
    pr_id: PR-280
    status: planned
    write_owner_module:
      - workflows.pain_signal.run_pain_signal_discovery
    note: |
      The prospect's relationship to the matched post. Selects the invite
      note's reference frame: only `poster` gets the authorship note;
      `commenter` and `liker` share the engagement note, because telling a
      non-author they wrote the post is the dangerous direction. An
      absent/unknown value falls back to the persona note LOUDLY — the
      builder never guesses. Options are seeded from
      models.campaign.PAIN_SIGNAL_SOURCE_TYPES; a workspace provisioned
      against an earlier revision (no `commenter`) is caught by the lane's
      wet-run preflight before any write.

  - object: linkedin_outreach
    slug: pain_snippet
    type: text
    options: null
    pr_id: PR-280
    status: planned
    write_owner_module:
      - workflows.pain_signal.run_pain_signal_discovery
    note: |
      Whitespace-collapsed excerpt (<=280 chars by default,
      `pain_snippet_max_chars` in the keyword registry) of the review
      context: a commenter's OWN comment when there is one, else the
      matched post's text. Operator-review context only — never rendered
      into an outgoing message.

  - object: linkedin_outreach
    slug: source_post_url
    type: text
    options: null
    pr_id: PR-280
    status: planned
    write_owner_module:
      - workflows.pain_signal.run_pain_signal_discovery
    note: |
      URL of the LinkedIn post that surfaced this prospect. Lets an
      operator verify the note's topic claim against the actual post.

  - object: linkedin_outreach
    slug: source_post_at
    type: text
    options: null
    pr_id: PR-280
    status: planned
    write_owner_module:
      - workflows.pain_signal.run_pain_signal_discovery
    note: |
      ISO-8601 UTC timestamp of the matched post, resolved at scrape time
      (the export may carry an epoch or a locale-dependent relative label).
      Measurement context for the lane's recency window; unset when the
      export carried no parseable timestamp — though such posts are dropped
      fail-closed before they can reach a commit.
