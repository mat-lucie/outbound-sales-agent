# Attio schema-delta manifest (F-PR-3.5)
#
# Single source of truth for every Attio schema addition across the 45-PR
# refactor plan. Each entry declares:
#   - object: the Attio object (existing or new)
#   - slug:   the attribute slug (omitted for new-object entries; the
#             new-object row carries `is_new_object: true`)
#   - type:   text | select | number | date | datetime | record_reference
#             | long_text | checkbox | currency | list_text
#   - options: list of string select options (required when type=select)
#   - pr_id:  the PR that ships this entry
#   - status: planned | shipped | verified | descoped
#       descoped = writer code shipped/registered but the Attio object is
#       intentionally absent per the minimize-objects decision; data lives
#       in a filesystem cache. Code must not WARN/ERROR on the expected
#       missing-object case.
#   - write_owner_module: dotted module path of the SOLE writer for this
#     attribute; multi-writer entries use a list. Consulted at runtime
#     by F-PR-4's AttioWriter to raise UnauthorizedAttioWriteError on
#     out-of-band writes.
#   - note: free-text rationale (optional)
#
# Validator: `scripts/validate_attio_schema_deltas.py`
#   - Internal consistency (no Attio access): no duplicate (object, slug);
#     select types have options; valid type strings; valid status values;
#     every entry has a pr_id + write_owner_module.
#   - Optional Attio collision check (--check-attio): warns when a
#     planned attribute slug already exists on the target object with a
#     different type.
#
# Update protocol:
#   - F-PR-3.5 lands this manifest with all entries status=planned.
#   - Each later PR's diff flips its own entries planned -> shipped.
#   - The §9 done-criterion verification flips shipped -> verified.
#   - `descoped` is a terminal state for minimize-objects entries: the
#     writer code is shipped but the Attio object is intentionally never
#     deployed (data lives in a filesystem cache). It does not transition
#     back to shipped/verified.
#   - New entries land in PR diffs that touch them; the validator runs
#     in CI on every PR.

schema_version: 1
plan_version: "1.7"
last_updated: "2026-08-31"  # Optional pain-signal lane: linkedin_outreach.prospect_source / pain_source_type / pain_snippet / source_post_url / source_post_at added, status=planned.  # Optional Botdog transport: linkedin_outreach.send_channel (read-only delivery routing) added, status=planned.  # Wave-2-A holdback rethink: experiment + weekly_kpi_snapshot → descoped (filesystem); cohort_membership/person_merge_audit/weekly_strategy_brief/diagnostic_run deleted (unbuilt/dead; all 404 live).

# Wave-2-A deploy holdback per agent-4 rethink (2026-05-25):
# These new_objects + every attribute targeting them are NOT to be
# deployed as standalone Attio objects. The decision is to collapse
# their data into column collections on existing objects (companies,
# people, deals, linkedin_outreach, daily_run, operator_review_queue)
# rather than spend Attio per-object surface area. Final placement
# pending a Wave-2 follow-up planning effort (subagent-driven).
#
# Per-entity collapse target + writer audit is tracked in
# docs/audits/wave-2-holdback-rethink-TODO.md.
#
# Until that rethink lands:
#  * status=shipped on these entries reflects WRITER CODE shipped,
#    NOT Attio schema deployed. Do not interpret as "live in Attio".
#  * scripts/migrate_attio_schema_F-PR-3.5b.py skips deploy of these
#    objects + their child attrs (reads this list).
#  * scripts/validate_attio_schema_deltas.py --check-attio-shipped
#    skips these objects + their child attrs (reads this list).
#  * The 17-attr R2-B1 blocker is resolved for attrs targeting EXISTING
#    objects (linkedin_outreach, companies, deals, people, daily_run);
#    the held-back attrs land via the rethink follow-up.
#
# Wave-2-A ext rationale: llm_budget_ledger was originally in this list
# but is hot-pathed via workflows.llm_dispatch.dispatch_llm (every LLM
# call). Holding it back would crash §3.7 cost-cap on the next dispatch
# (404 on _find_ledger_row). It now deploys as a regular Attio object
# in this wave; the file-system journal refactor (refactor-QA Rec #2)
# can land later as a non-blocking improvement.
deploy_holdback_objects:
  - experiment
  - weekly_kpi_snapshot
# tracker_url: docs/audits/wave-2-holdback-rethink-TODO.md

